<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ODIN // Local AI System</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="odin-app">

<!-- HEADER -->
<header class="header">

    <div class="brand">

        <div class="logo">ODIN</div>

        <div class="system-title">
            <div>// LOCAL AI SYSTEM</div>
            <div>THINK · AUTOMATE · CONTROL</div>
        </div>

    </div>


    <div class="header-status">

        <!-- ONLINE -->
        <div class="status">
            <span class="status-dot"></span>
            <span>ONLINE</span>
        </div>


        <!-- GPU STATUS -->
        <div class="gpu-status">

            <span class="gpu-item">
                GPU
                <span id="gpu-temperature">--°C</span>
            </span>

            <span class="gpu-item">
                LOAD
                <span id="gpu-utilization">--%</span>
            </span>

        </div>


        <div class="header-divider"></div>


        <!-- DATE / TIME -->
        <div class="datetime">
            <div id="date">--. --- ----</div>
            <div id="time">--:--</div>
        </div>

    </div>

</header>

        <!-- GRADIENT LINE -->
        <div class="gradient-line"></div>


        <!-- CHAT -->
        <main class="chat-container" id="chat">

            <!-- ODIN MESSAGE -->
            <div class="message odin-message">

                <div class="avatar odin-avatar">
                    <div class="avatar-core"></div>
                </div>

                <div class="message-content">

                    <div class="message-header">
                        <span class="sender">ODIN</span>
                        <span class="message-time">09:42</span>
                    </div>

                    <div class="message-box">

                        <div class="message-text">
                            Guten Morgen.<br>
                            Ich bin Odin, dein lokaler Assistent.<br>
                            Wie kann ich dir heute helfen?
                        </div>

                    </div>

                </div>

            </div>

        </main>


        <!-- INPUT -->
        <form class="input-area" id="chat-form">

            <div class="input-prefix">&gt;</div>

            <input
                type="text"
                id="message-input"
                placeholder="Schreibe eine Nachricht..."
                autocomplete="off"
                spellcheck="false"
            >

            <button type="submit" id="send-button" aria-label="Nachricht senden">
                <span class="send-icon">➤</span>
            </button>

        </form>


        <!-- FOOTER -->
        <footer class="footer">

            <div class="footer-left">
                ODIN v0.1
                <span>|</span>
                Powered by Bonsai
                <span>|</span>
                Local &amp; Private
            </div>

            <div class="footer-right">
                <span>SYSTEM</span>
                <span>|</span>
                <span>HOME</span>
                <span>|</span>
                <span>DOCKER</span>
                <span>|</span>
                <span>MORE SOON ...</span>
            </div>

        </footer>

    </div>


    <script src="/static/app.js"></script>

</body>
</html>
